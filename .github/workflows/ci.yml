name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Dead code
        run: npm run deadcode
      - name: Types
        run: npm run typecheck
      - name: Contract artifact is up to date
        run: npm run compile:contract && git diff --exit-code src/chain/artifact.json
      - name: Unit and contract tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
